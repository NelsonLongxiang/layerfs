# The Windows-native release gate. The fast lane (ci.yml) reports and never
# blocks a push or merge (AGENTS.md §4); this workflow is the *release*
# criterion: a red run means the 1.2.0 tag must not be created. It runs by
# hand and on release tags, so ordinary pushes stay governed by the fast lane.
name: windows-native-gate

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: windows-native-gate-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  windows-native:
    name: windows native suites (release gate)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install 1.85.1 --profile minimal
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: . -> target
          save-if: false
      # Build first so compile time is never counted against the 120 s ceilings.
      - name: Build test binaries
        run: >
          cargo +1.85.1 test --manifest-path Cargo.toml --locked --no-run
          -p layerfs-content -p layerfs-persistence -p layerfs-project
          -p layerfs-overlay -p layerfs-store-service
      # The native route's SDK face: init/fork/write/apply/edit/publish against
      # a temporary Store, and the daemon-backed family refusing Unsupported.
      - name: Native route SDK face
        shell: bash
        run: |
          cargo +1.85.1 build --manifest-path Cargo.toml --locked -p layerfs-node
          cp target/debug/layerfs_node.dll engine/crates/layerfs-node/layerfs.node
          timeout 110 node api/agent/test/route-native.mjs
      # Hard gate: any red crate fails this run. No || true, no continue-on-error.
      - name: Run windows store suites (each crate capped at 120 s)
        shell: bash
        run: |
          status=0
          for crate in layerfs-content layerfs-persistence layerfs-project \
                       layerfs-overlay layerfs-store-service; do
            echo "## $crate"
            timeout 120 cargo +1.85.1 test --manifest-path Cargo.toml --locked -p "$crate" || status=1
          done
          exit $status
