<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker></defs><rect width="1100" height="620" fill="#f8fafc"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif" fill="#0f172a"><text x="30" y="46" font-size="23" font-weight="700">LayerFS 纯 Windows：真实操作 → Overlay → Commit</text><text x="30" y="79" font-size="14">绿色：已有真实组件　蓝色：原生接线/验证　黄色：未合格范围；非产品发布</text><path d="M250,155 H290" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M510,155 H550" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M780,155 H820" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M250,335 H290" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M510,335 H550" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M780,335 H820" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M935,290 V200" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M935,380 V470" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="110" width="220" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="44" y="137" font-size="16" font-weight="700">普通 Windows 进程</text><text x="44" y="161" font-size="12">文件 API：读写 / 截断 / 改名 / 删除</text><text x="44" y="181" font-size="12">打开描述符跨两次 Commit</text><rect x="290" y="110" width="220" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="304" y="137" font-size="16" font-weight="700">WinFsp 原生回调</text><text x="304" y="161" font-size="12">C++ 薄适配 + 窄 C ABI</text><text x="304" y="181" font-size="12">无 C++ 文件字节后端</text><rect x="550" y="110" width="230" height="90" rx="10" fill="#dcfce7" stroke="#16803c" stroke-width="1.5"/><text x="564" y="137" font-size="16" font-weight="700">Rust Workspace / Overlay</text><text x="564" y="161" font-size="12">真实 SQLite MEMORY / OFF</text><text x="564" y="181" font-size="12">已有公共端口与句柄所有权</text><rect x="30" y="290" width="220" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="44" y="317" font-size="16" font-weight="700">显式 Commit 控制</text><text x="44" y="341" font-size="12">每个指令一次尝试，不重放</text><text x="44" y="361" font-size="12">诊断 capture 先独立释放</text><rect x="290" y="290" width="220" height="90" rx="10" fill="#dcfce7" stroke="#16803c" stroke-width="1.5"/><text x="304" y="317" font-size="16" font-weight="700">commit_captured</text><text x="304" y="341" font-size="12">固定 locally published frontier</text><text x="304" y="361" font-size="12">CapturedNamespace 构造</text><rect x="550" y="290" width="230" height="90" rx="10" fill="#dcfce7" stroke="#16803c" stroke-width="1.5"/><text x="564" y="317" font-size="16" font-weight="700">Content → Storage Save</text><text x="564" y="341" font-size="12">复用 canonical 构造与编码</text><text x="564" y="361" font-size="12">Save::finish 完成对象闭合</text><rect x="820" y="290" width="230" height="90" rx="10" fill="#dcfce7" stroke="#16803c" stroke-width="1.5"/><text x="834" y="317" font-size="16" font-weight="700">History → 本地 Install</text><text x="834" y="341" font-size="12">真实 Commit；via=Workspace</text><text x="834" y="361" font-size="12">推进 base，保留打开句柄</text><rect x="820" y="110" width="230" height="90" rx="10" fill="#dcfce7" stroke="#16803c" stroke-width="1.5"/><text x="834" y="137" font-size="16" font-weight="700">单一全局 Store</text><text x="834" y="161" font-size="12">Windows NTFS / SQLite</text><text x="834" y="181" font-size="12">Disposable / WAL / OFF</text><rect x="820" y="470" width="230" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="834" y="497" font-size="16" font-weight="700">独立只读进程重开</text><text x="834" y="521" font-size="12">两版本字节、长度、父子关系</text><text x="834" y="541" font-size="12">UpToDate 不新增 Commit</text><rect x="30" y="470" width="750" height="90" rx="10" fill="#fff3cd" stroke="#b7791f" stroke-width="1.5"/><text x="44" y="497" font-size="16" font-weight="700">未合格范围：不要从局部活证外推</text><text x="44" y="521" font-size="12">根条目诊断；桥 mutex 串行；并发写 / Commit、映射与崩溃恢复未验证</text><text x="44" y="541" font-size="12">完整仓库、产品 SDK Workspace 接入、第二次原生挂载仍未完成</text><text x="30" y="595" font-size="12" fill="#475569">证据分层：活挂载顺序用例 + 独立只读重开；并发与 mapped-write 不在本图的通过范围。</text></g></svg>
