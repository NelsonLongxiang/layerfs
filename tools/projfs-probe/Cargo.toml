[package]
name = "layerfs-projfs-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

# Independent diagnostic; not a product workspace member or SDK implementation.
[workspace]

[target.'cfg(windows)'.dependencies]
# Existing first-party public ports; no alternate encoder or database driver.
layerfs-content = { path = "../../core/crates/layerfs-content" }
layerfs-storage = { path = "../../core/crates/layerfs-storage" }
layerfs-history = { path = "../../core/crates/layerfs-history", default-features = false }
layerfs-telemetry = { path = "../../core/crates/layerfs-telemetry" }
layerfs-persistence = { path = "../../engine/crates/layerfs-persistence" }
layerfs-project = { path = "../../engine/crates/layerfs-project" }
layerfs-store-service = { path = "../../engine/crates/layerfs-store-service" }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Storage_ProjectedFileSystem", "Win32_System_LibraryLoader", "Win32_System_Com"] }
